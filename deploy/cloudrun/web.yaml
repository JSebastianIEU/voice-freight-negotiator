# Cloud Run service for the Next.js client. Request-driven, so it scales to zero: the
# only thing it does between calls is nothing. /api/token signs room tokens with the
# LiveKit secret read from Secret Manager at request time; the browser never sees it.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: web
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: web-runtime@__PROJECT_ID__.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - image: __IMAGE__
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: LIVEKIT_URL
              value: __LIVEKIT_URL__
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-api-key
                  key: latest
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-api-secret
                  key: latest
            - name: LIVEKIT_AGENT_NAME
              value: freight-negotiator
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
