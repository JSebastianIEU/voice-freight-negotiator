# Every pull request and every push to main: the same checks a contributor runs locally
# (make lint, make test, npm run lint, next build), plus a build of both container images
# so a broken Dockerfile is caught before the deploy workflow ever runs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent:
    name: agent · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.x"
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Offline tests only; anything that calls a model is marked `integration`.
      - run: uv run pytest -m "not integration"

  web:
    name: web · lint + typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  images:
    name: images · docker build
    runs-on: ubuntu-latest
    needs: [agent, web]
    strategy:
      matrix:
        include:
          - name: agent
            context: agent
            dockerfile: deploy/agent.Dockerfile
          - name: web
            context: web
            dockerfile: deploy/web.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: freight-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
