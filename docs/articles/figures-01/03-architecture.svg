<text x="1062" y="356" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">STT / LLM / TTS calls</text>
<line x1="456" y1="430" x2="620" y2="268" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
