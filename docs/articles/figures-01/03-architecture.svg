<text x="500" y="460" font-size="13" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">token + dispatch</text>
<text x="620" y="600" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Desk events travel back to the browser</text>
<text x="620" y="620" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">over the room's data channel:</text>
<text x="620" y="648" font-size="13" fill="#0b0b0b" font-weight="normal" text-anchor="start" font-family="Liberation Mono, Menlo, monospace" opacity="1.0">carrier.verified · rate.proposed</text>
