<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="1600" height="720" fill="#fcfcfb"/>
<text x="56" y="52" font-size="30" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Where a freight broker's margin lives</text>
<text x="56" y="84" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">One load, three parties. The whole business is the gap between two phone calls.</text>
<rect x="100" y="240" width="320" height="140" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="260.0" y="296" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Company</text>
<text x="260.0" y="326" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">the shipper</text>
<text x="260.0" y="346" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">42,000 lbs, Chicago → Dallas</text>
<rect x="640" y="240" width="320" height="140" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<rect x="640" y="240" width="6" height="140" rx="3" fill="#eb6834" stroke="none" stroke-width="1"/>
<text x="800.0" y="296" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Alex</text>
<text x="800.0" y="326" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">the broker's sales rep</text>
<text x="800.0" y="346" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">a voice agent</text>
<rect x="1180" y="240" width="320" height="140" rx="10" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/>
<text x="1340.0" y="296" font-size="22" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Trucker</text>
<text x="1340.0" y="326" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">the carrier</text>
<text x="1340.0" y="346" font-size="14" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">an empty 53' dry van</text>
<text x="530.0" y="284" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">what the company pays</text>
<text x="530.0" y="316" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$3,300</text>
<line x1="430" y1="336" x2="630" y2="336" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<line x1="630" y1="336" x2="619.1946347717678" y2="341.21958640933474" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<line x1="630" y1="336" x2="619.1946347717678" y2="330.78041359066526" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<text x="1070.0" y="284" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">what the trucker is paid, by phone</text>
<text x="1070.0" y="316" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$2,700</text>
<line x1="970" y1="336" x2="1170" y2="336" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<line x1="1170" y1="336" x2="1159.1946347717678" y2="341.21958640933474" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<line x1="1170" y1="336" x2="1159.1946347717678" y2="330.78041359066526" stroke="#52514e" stroke-width="3" stroke-linecap="round"/>
<rect x="680" y="420" width="240" height="54" rx="8" fill="#fdeee7" stroke="none" stroke-width="1"/>
<text x="800.0" y="443" font-size="20" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$600 margin</text>
<text x="800.0" y="464" font-size="13" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">every dollar more for the trucker is a dollar less here</text>
<line x1="120" y1="490" x2="1480" y2="490" stroke="#e6e5e1" stroke-width="1" stroke-linecap="round"/>
<text x="120" y="520" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Alex's private numbers for this load</text>
<text x="120" y="550" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">open at</text>
<text x="120" y="582" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$2,450</text>
<text x="360" y="550" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">aim for</text>
<text x="360" y="582" font-size="26" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$2,700</text>
<text x="600" y="550" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">never above</text>
<text x="600" y="582" font-size="26" fill="#e34948" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">$2,950</text>
<text x="860" y="550" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">the carrier never hears any of these three numbers.</text>
<text x="860" y="576" font-size="15" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">The first version kept them in the prompt. The second keeps them in code.</text>
<text x="1480" y="690" font-size="12" fill="#8a8985" font-weight="normal" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Source: Image by the author.</text>
</svg>