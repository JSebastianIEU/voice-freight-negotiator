<text x="56" y="640" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Why the gray part is the biggest: the turn detector waits up to 1.2 s after silence when it is not sure the caller has finished,</text>
<text x="56" y="662" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">because "thirty-two... fifty" is one number. Cutting that wait is a bench experiment, not a code change.</text>
<text x="1544" y="790" font-size="12" fill="#8a8985" font-weight="normal" text-anchor="end" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Source: Image by the author.</text>
