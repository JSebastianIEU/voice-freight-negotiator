<text x="1457.125" y="224" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Cartesia Sonic</text>
<text x="1457.125" y="240" font-size="12" fill="#52514e" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">the voice</text>
<text x="56" y="292" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">LLM ⇄ desk: one extra round trip whenever money or identity comes up. The filter costs nothing: TTS already starts on the first complete sentence.</text>
<text x="56" y="400" font-size="18" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">One real call from a browser, 8 turns. Median from the caller's last word to Alex's first sound: 1.78 s</text>
<text x="56" y="426" font-size="14" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Measured by the worker on Cloud Run (europe-west1). The desk's round trips are inside the LLM segment when they happen.</text>
<rect x="56" y="470" width="1021.9910263600673" height="44" rx="4" fill="#e6e5e1" stroke="none" stroke-width="1"/>
<text x="68" y="498" font-size="15" fill="#0b0b0b" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">waiting for the caller to finish, STT final, network · 1.23 s</text>
<rect x="1079.9910263600673" y="470" width="356.85586090858106" height="44" rx="4" fill="#2a78d6" stroke="none" stroke-width="1"/>
