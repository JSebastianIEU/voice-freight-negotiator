<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<rect width="1600" height="940" fill="#fcfcfb"/>
<text x="56" y="52" font-size="30" fill="#0b0b0b" font-weight="bold" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">One negotiation turn, when the caller names a price</text>
<text x="56" y="84" font-size="17" fill="#52514e" font-weight="normal" text-anchor="start" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">What happens between "thirty-one hundred" and Alex's answer. Orange steps are code, not model.</text>
<rect x="40" y="116" width="180" height="44" rx="8" fill="#f5f4f1" stroke="none" stroke-width="1.5"/>
<text x="130" y="144" font-size="15" fill="#0b0b0b" font-weight="bold" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Caller</text>
