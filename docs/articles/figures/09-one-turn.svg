<line x1="1476" y1="870" x2="134" y2="870" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<line x1="134" y1="870" x2="144.80536522823212" y2="864.7804135906653" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<line x1="134" y1="870" x2="144.80536522823212" y2="875.2195864093347" stroke="#52514e" stroke-width="2" stroke-linecap="round"/>
<text x="805.0" y="860" font-size="14" fill="#0b0b0b" font-weight="normal" text-anchor="middle" font-family="Liberation Sans, Arial, Helvetica, sans-serif" opacity="1.0">Alex's voice, about 1.8 s after the caller's last word · the browser shows  $3,100 · blocked  and  $2,575 offered  from the desk's events</text>
